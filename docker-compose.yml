services:
  postgres:
    image: postgres:15-alpine
    container_name: nest-news-postgres
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-nest_news}
    volumes:
      - /mnt/postgres-data:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
    container_name: nest-news-api
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      TZ: Asia/Seoul
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8008:8008"
    networks:
      - app-net

networks:
  app-net: